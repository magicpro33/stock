# .github/workflows/nightly_scan.yml
#
# Runs nightly_scan.py after the US close (22:30 UTC = 6:30pm EDT / 5:30pm EST).
# Saves the output to the data/ folder and commits it back to the repo.
# The Streamlit app reads from data/stock_data.json.gz on startup.
#
# To trigger manually: go to Actions → Nightly Stock Scan → Run workflow

name: Nightly Stock Scan

on:
  schedule:
    # 22:30 UTC — AFTER the US close, so the run captures the SAME day's data.
    #   EDT: close 20:00 UTC -> this runs 2h30m later (6:30pm ET)
    #   EST: close 21:00 UTC -> this runs 1h30m later (5:30pm ET)
    #
    # WHY THIS CHANGED: the old "0 7 * * 1-5" fired at 07:00 UTC — 3am ET,
    # BEFORE the market opened that day. Friday's 07:00 run therefore captured
    # THURSDAY's close, and with weekdays-only there was no Saturday run, so
    # Friday's close did not land until Monday morning. The app was showing
    # data up to two sessions stale all weekend.
    - cron: "30 22 * * 1-5"   # weekdays only — markets are closed on weekends

  workflow_dispatch:          # allows manual trigger from GitHub Actions UI
    inputs:
      reason:
        description: "Reason for manual run"
        required: false
        default: "Manual trigger"

jobs:
  scan:
    name: Download & compute stock data
    runs-on: ubuntu-latest
    timeout-minutes: 240      # 4 hour hard cap — kills stuck jobs

    steps:
      # ── 1. Check out the repo ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ─────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # lxml is needed by pandas.read_html for S&P 500 Wikipedia table
          # Install separately first so failures are visible
          pip install lxml html5lib
          pip install yfinance pandas numpy requests

      # ── 4. Create data directory if it doesn't exist ─────────────────────
      - name: Ensure data directory exists
        run: mkdir -p data

      # ── 5. Run the nightly scan ───────────────────────────────────────────
      - name: Run nightly scan
        run: python nightly_scan.py
        timeout-minutes: 210

      # ── 6. Commit only if output files were actually produced ─────────────
      - name: Commit data files
        run: |
          if [ -f data/stock_data.json.gz ] && [ -f data/scan_meta.json ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            # Fetch latest remote state so we can rebase cleanly
            git fetch origin main
            git reset --soft origin/main
            git add data/stock_data.json.gz data/scan_meta.json
            # Only commit if there are staged changes
            git diff --staged --quiet || git commit -m "chore: nightly scan $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push origin main
            echo "Data files committed successfully."
          else
            echo "ERROR: data files not found — scan failed. Check logs above."
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 7. Upload as artifact (backup, visible in Actions UI) ─────────────
      - name: Upload scan results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-data-${{ github.run_id }}
          path: |
            data/stock_data.json.gz
            data/scan_meta.json
          retention-days: 7
          if-no-files-found: warn
